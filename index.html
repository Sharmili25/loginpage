<!DOCTYPE html>
<html>
<head>
    <title>Doctor Appointment - Login</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e8f6f3;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #168aad;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #168aad;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #126782;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Doctor Appointment</h2>

    <form>
        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Password:</label>
        <input type="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

        <div class="link">
            <p><a href="#">Forgot Password?</a></p>
            <p>New User? <a href="#">Register Here</a></p>
        </div>
    </form>

</div>

</body>
</html>
